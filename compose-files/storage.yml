version: '3'
services:
  storage:
    image: ghcr.io/oceanprotocol/barge:storage
    ports:
      - "80:80"
      - "443:443"
      - "20-21:20-21"
      - "7480:7480"        # Ceph RGW (S3 + Swift)
      - "8080:8080"        # Ceph RGW (S3 + Swift)
    environment:
      MAIN: "none"
      ACCESS_KEY: "ocean123"
      SECRET_KEY: "ocean123secret"
      MGR_USERNAME: "admin"
      MGR_PASSWORD: "admin"
    networks:
      ocean_backend:
        ipv4_address: 172.15.0.7
    volumes:
    - ${OCEAN_WWW_FOLDER}:/var/www/html
    - ${OCEAN_FTP_FOLDER}:/srv/ftp
    
    

volumes:
  www:
  ftp:
  ceph_data:

